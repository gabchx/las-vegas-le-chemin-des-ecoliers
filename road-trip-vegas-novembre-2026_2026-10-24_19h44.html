<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<title>Vegas, par le chemin des écoliers : Du 3 au 14 novembre 2026, en van</title>
<style id="css">
:root{
  --bg:#E4E8E3; --surface:#F2F4F0; --ink:#1E2430; --muted:#566070; --rule:#C3CAC2;
  --accent:#1F6A72; --warn:#9A3F1C; --warnbg:#F3E2D6; --nerd:#E3E9EE;
  --mapbg:#EEF0EA; --water:#3F7FA6; --grat:rgba(30,36,48,.07); --road:#FFFFFF; --roadcase:#C3BEB1; --park:rgba(92,140,86,.13); --parkline:#4F8049; --relief:#A8977A;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10152A; --surface:#181F38; --ink:#E8E5DB; --muted:#A2A9BB; --rule:#2B3453;
    --accent:#72C6CC; --warn:#F2A27A; --warnbg:#2E2230; --nerd:#1C2744; --mapbg:#141B33; --water:#6FB4D8; --grat:rgba(232,229,219,.07); --road:#56607E; --roadcase:#232B47; --park:rgba(120,180,110,.11); --parkline:#86BE7C; --relief:#5A6690; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10152A; --surface:#181F38; --ink:#E8E5DB; --muted:#A2A9BB; --rule:#2B3453;
  --accent:#72C6CC; --warn:#F2A27A; --warnbg:#2E2230; --nerd:#1C2744; --mapbg:#141B33; --water:#6FB4D8; --grat:rgba(232,229,219,.07); --road:#56607E; --roadcase:#232B47; --park:rgba(120,180,110,.11); --parkline:#86BE7C; --relief:#5A6690; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(28px,6vw,72px) 0 clamp(20px,3vw,32px)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(3rem,9vw,6.6rem);line-height:.88;letter-spacing:-.01em;margin:0 0 .3em}
.hero h1 .h1main{display:block}
.hero h1 .h1sub{display:block;font-weight:500;color:var(--muted);font-size:.42em;line-height:1.1;margin-top:.35em;letter-spacing:0}
.lede{font-size:1.15rem;max-width:34em;margin:0 0 1rem}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none;font-family:var(--display);font-size:1.2rem;font-weight:600}
.facts li span{font-weight:500;color:var(--muted)}
.map{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:8px}
.map svg{display:block;width:100%;height:auto}
.map text{font-family:var(--display);fill:var(--ink)}
.map .st{stroke:var(--rule);stroke-width:1.2;fill:none;stroke-dasharray:4 4}
.map .stl{fill:var(--muted);font-size:15px;font-weight:500}
.map .route{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.map .stop{cursor:pointer}
.map .stop circle{stroke:var(--surface);stroke-width:2}
.map .lab{font-size:17px;font-weight:600}
.map .lab tspan.d{fill:var(--muted);font-weight:500}

/* strata nav */
.strata{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.strata ol{display:flex;margin:0 auto;padding:8px clamp(16px,4vw,40px);list-style:none;gap:4px;overflow-x:auto;max-width:1160px;scrollbar-width:thin}
.strata a{display:block;min-width:76px;text-decoration:none;color:var(--ink);font-family:var(--display);line-height:1.1;padding:8px 6px 6px;border-top:10px solid var(--c);border-radius:2px 2px 0 0}
.strata a b{display:block;font-size:1.05rem}
.strata a small{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap}
.strata a[aria-current="true"]{background:var(--surface)}

/* prep */
h2.sec{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.5vw,3rem);line-height:1;margin:56px 0 8px}
.sub{color:var(--muted);margin:0 0 20px;max-width:46em}
.prep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,40px)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:20px 22px}
.panel h3{font-family:var(--display);font-size:1.5rem;margin:0 0 10px;font-weight:600}
.check{list-style:none;margin:0;padding:0}
.check li{border-top:1px solid var(--rule);padding:10px 0}
.check li:first-child{border-top:0}
.check label{display:grid;grid-template-columns:22px 1fr;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent)}
.check .when{display:block;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--warn)}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.notes p{margin:0 0 .8em}
.notes b{font-family:var(--display);font-size:1.1rem;font-weight:600}
.weather{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:6px}
.weather th,.weather td{text-align:left;padding:5px 6px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.weather th{font-family:var(--display);font-weight:600;font-size:1rem}
.scroll{overflow-x:auto}

/* days */
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:clamp(16px,3vw,36px);padding:44px 0;border-top:1px solid var(--rule)}
.day:first-of-type{border-top:0}
.core{position:relative;display:flex;flex-direction:column;align-items:flex-start}
.core .num{font-family:var(--display);font-weight:700;font-size:4.2rem;line-height:.85}
.core .date{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:6px 0 12px}
.core .sample{width:46px;flex:1;min-height:180px;background:var(--c);border-radius:23px 23px 4px 4px;position:relative;background-image:repeating-linear-gradient(176deg,transparent 0 13px,rgba(255,255,255,.18) 13px 15px,transparent 15px 31px,rgba(0,0,0,.08) 31px 33px)}
.core .rock{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:.95rem;color:var(--muted);margin-top:10px;max-height:260px}
.day h3{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1;margin:0 0 6px}
.drive{font-family:var(--display);font-size:1.15rem;font-weight:500;margin:0 0 14px;color:var(--muted)}
.drive b{color:var(--ink);font-weight:600}
.sky{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 18px;padding:0;list-style:none;font-family:var(--display);font-size:1.05rem}
.sky li .lab{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(18px,3vw,34px)}
.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--rule)}
.sched li:first-child{border-top:0}
.sched time{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.1rem}
.hikes{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:.95rem}
.hikes caption{text-align:left;font-family:var(--display);font-weight:600;font-size:1.2rem;padding-bottom:4px}
.hikes td{padding:6px 6px 6px 0;border-top:1px solid var(--rule);vertical-align:top}
.hikes td.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.nerd{background:var(--nerd);border-radius:4px;padding:14px 16px;margin:0 0 14px}
.nerd h4,.alt h4{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 6px}
.nerd ul{margin:0;padding-left:1.1em}
.nerd li{margin:0 0 .45em}
.alt{border-left:3px solid var(--warn);padding:2px 0 2px 14px;margin:0 0 12px}
.alt p{margin:0}
.sleep{font-size:.98rem;margin:0}
.sleep b{font-family:var(--display);font-size:1.1rem;font-weight:600}
footer{border-top:1px solid var(--rule);margin-top:40px;padding:28px 0 110px;color:var(--muted);font-size:.95rem}
footer p{max-width:48em}

@media (max-width:860px){
  .hero,.prep,.cols{grid-template-columns:minmax(0,1fr)}
  .day{grid-template-columns:minmax(0,1fr)}
  .core{flex-direction:row;align-items:center;gap:14px}
  .core .date{margin:0}
  .core .sample{flex:none;width:100%;max-width:none;min-height:14px;height:14px;border-radius:7px;order:3;flex-basis:100%}
  .core{flex-wrap:wrap}
  .core .rock{writing-mode:horizontal-tb;transform:none;margin:0}
}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}

.avis{max-width:46em}
.editbar{position:fixed;right:clamp(12px,3vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;box-shadow:0 6px 24px rgba(20,24,40,.22);font-family:var(--display);font-size:1rem}
.editbar[hidden]{display:none}
.editbar .msg{color:var(--muted);max-width:26em;line-height:1.2}
.editbar button,.add{font-family:var(--display);font-weight:600;font-size:1rem;border-radius:4px;padding:6px 12px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.editbar button.primary{background:var(--accent);color:var(--surface)}
.editbar button:disabled{opacity:.6;cursor:default}
.add{display:inline-block;margin:8px 0 4px;font-size:.95rem;padding:3px 10px;border-style:dashed}
.del{border:0;background:transparent;color:var(--warn);font-size:1.25rem;line-height:1;cursor:pointer;padding:0 4px;vertical-align:baseline}
.editing [contenteditable]{outline:1px dashed var(--muted);outline-offset:2px;border-radius:2px;cursor:text}
.editing [contenteditable]:focus{outline:2px solid var(--accent)}
.editing [contenteditable]:empty::before{content:"…";color:var(--muted)}
.editing .sched li{grid-template-columns:62px 1fr 24px}
.editing p.row,.check li.row{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:8px;align-items:start}
.check li.row .txt{display:block}
.editing .core .rock{writing-mode:horizontal-tb;transform:none;max-height:none}

.hero{grid-template-columns:minmax(0,1fr)!important;padding-bottom:12px!important}
.mapsec{margin:8px auto 28px}
.chips{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--rule);border-radius:6px;overflow-x:auto;background:var(--surface);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.mchip{flex:1 0 auto;min-width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 8px 7px;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--muted);font-family:var(--display);cursor:pointer;position:relative;transition:background-color .15s,color .15s}
.mchip:last-child{border-right:0}
.mchip::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c,var(--ink))}
.mchip b{font-size:1.15rem;font-weight:700;line-height:1;color:var(--ink)}
.mchip small{font-size:.8rem;line-height:1.1;white-space:nowrap}
.mchip:hover{background:var(--bg)}
.mchip[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.mchip[aria-pressed="true"]::before{height:7px}
.mchip[aria-pressed="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--ink)}
.mchip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface);box-shadow:0 2px 8px rgba(20,24,40,.12)}
.zoom button{width:36px;height:36px;display:grid;place-items:center;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{background:var(--bg)}
.zoom svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mapframe{position:relative;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--mapbg);aspect-ratio:720/440;touch-action:none;cursor:grab}
.mapframe:active{cursor:grabbing}
.mapframe > #map{display:block;width:100%;height:100%}
#map text{font-family:var(--display)}
#map .mbg{fill:var(--mapbg)}
#map .grat{stroke:var(--grat);stroke-width:1;vector-effect:non-scaling-stroke}
#map .gl{fill:var(--muted);opacity:.7}
#map .st{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4;fill:none;vector-effect:non-scaling-stroke;opacity:.6}
#map .stn{fill:var(--muted);font-weight:600;letter-spacing:.06em;opacity:.55}
#map .river{fill:none;stroke:var(--water);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
#map .lake{fill:none;stroke:var(--water);stroke-width:6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55}
#map .rl{fill:var(--water);font-style:italic;font-family:var(--body)!important;opacity:.95}
#map .rcase{fill:none;stroke:var(--mapbg);stroke-width:7;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
#map .rline{fill:none;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
#map .dim{opacity:.18}
#map .mstop,#map .mlab{cursor:pointer}
#map .mstop .hit{fill:transparent}
#map .msym{stroke-width:1.8;vector-effect:non-scaling-stroke}
#map .camp{fill:#2F6B3A;stroke:var(--mapbg);stroke-width:1.2}
#map .camp.paid{fill:#8A5A12}
#map .mstop.on .msym{stroke:var(--ink);stroke-width:3}
#map .mstop:focus{outline:none}
#map .mstop:focus-visible .msym{stroke:var(--accent);stroke-width:3}
#map .mlab{fill:var(--ink);font-weight:600;stroke:var(--mapbg);paint-order:stroke;stroke-linejoin:round}
#map .mlab.hub{font-weight:700}
.mapbelow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px 28px;margin-top:12px}
.mapinfo{display:grid;gap:12px}
.mcard,.mday{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.mcard{border-left:4px solid var(--accent)}
.mapinfo h3{font-family:var(--display);font-size:1.5rem;line-height:1.05;margin:0 0 6px}
.mapinfo p{margin:0 0 8px}
.mk{color:var(--muted);font-family:var(--display);font-size:.98rem}
.mlist{margin:6px 0 12px;padding-left:1.4em;columns:2 15em;column-gap:24px}
.mlist li{break-inside:avoid;margin:0 0 4px}
.mlink{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.gbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1.02rem;padding:6px 12px 6px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);text-decoration:none;margin:4px 6px 2px 0;transition:border-color .15s}
.gbtn:hover{border-color:var(--accent)}
.gbtn .pin{width:15px;height:15px;flex:none}
.gbtn .pin path{fill:#D9473B}
.gbtn .pin circle{fill:#fff}
.legend{list-style:none;margin:0;padding:0;font-family:var(--display);font-size:1.02rem;display:grid;gap:4px;align-content:start}
.legend li{display:flex;align-items:center;gap:8px}
.legend svg{width:16px;height:16px}
.lg-rando{fill:var(--ink)}.lg-vue{fill:var(--surface);stroke:var(--ink);stroke-width:2}.lg-camp{fill:#2F6B3A}.lg-paid{fill:#8A5A12}
.mnote{color:var(--muted);font-size:.9rem;margin:8px 0 0;grid-column:2}
@media (max-width:860px){.mapframe{aspect-ratio:1/1}.mapbelow{grid-template-columns:minmax(0,1fr)}.mnote{grid-column:auto}}

.sched .sc{min-width:0}
.place{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px;font-family:var(--display);font-size:1rem;line-height:1.3}
.plshow{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.plshow:hover{text-decoration:underline;text-underline-offset:2px}
.plname{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600}
.place .pin{width:13px;height:13px;flex:none}
.pin path{fill:#D9473B}.pin circle{fill:#fff}
.plg{color:var(--muted);font-size:.92rem;text-underline-offset:2px}
.sleepbox{margin:0}
.sleepbox .place{margin-top:2px}
.pled{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin:7px 0 3px;padding:9px 11px;border:1px dashed var(--muted);border-radius:6px;font-size:.95rem;background:var(--surface);align-items:start}
.pll{font-family:var(--display);color:var(--muted);font-size:.92rem;padding-top:1px}
.pllv{min-width:0}
.plbad{display:block;color:var(--warn);font-size:.85rem;font-style:normal;margin-top:2px}
.plhint{display:block;color:var(--muted);font-size:.82rem;font-style:normal;margin-top:2px}
.kindbtn,.rmpl{font-family:var(--display);font-weight:600;font-size:.92rem;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:4px;padding:2px 9px;cursor:pointer}
.rmpl{color:var(--warn)}
.addpl{display:block;margin:5px 0 0;font-size:.88rem;padding:1px 9px}
.moff{color:var(--muted)}
.themebtn{position:fixed;left:clamp(12px,3vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 11px;border:1px solid var(--rule);border-radius:19px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 6px 24px rgba(20,24,40,.18)}
.themebtn:hover{border-color:var(--accent)}
.themebtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.themebtn svg .half{fill:currentColor;stroke:none}
@media (max-width:520px){.themebtn span{display:none}.themebtn{padding:0 10px}}
.gps{margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.gpsv{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;font-variant-numeric:tabular-nums;user-select:all;padding:1px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--bg)}
.sky li.wx{margin-left:auto}
.wxbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1rem;padding:3px 11px 3px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s}
.wxbtn:hover{border-color:var(--accent)}
.wxbtn svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.editbar .ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px}

#map .rlf0{stop-color:var(--relief);stop-opacity:.3}#map .rlf1{stop-color:var(--relief);stop-opacity:.12}#map .rlf2{stop-color:var(--relief);stop-opacity:0}
#map .relief{fill:url(#rlfg)}
#map .park{fill:var(--park);stroke:var(--parkline);stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
#map .pklab{fill:var(--parkline);font-family:var(--body)!important;font-style:italic;font-weight:600;opacity:.85;pointer-events:none}
#map .rdc,#map .rdf{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
#map .rdc{stroke:var(--roadcase)}
#map .rdf{stroke:var(--road)}
#map .rdc.rd-hist{stroke:#9A7240;opacity:.55}#map .rdf.rd-hist{stroke:var(--mapbg);stroke-dasharray:4 3}
#map .town{fill:var(--muted)}
#map .peak{fill:var(--muted);opacity:.8}
#map .tlab{fill:var(--muted);font-weight:600;stroke:var(--mapbg);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
#map .plab{fill:var(--muted);font-family:var(--body)!important;font-style:italic;stroke:var(--mapbg);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
#map .shield{pointer-events:none}
#map .shield text{font-weight:700}
#map .sh-i rect{fill:#2D5DA8;stroke:#fff}#map .sh-i text{fill:#fff}
#map .sh-us rect{fill:#fff;stroke:#2A2A2A}#map .sh-us text{fill:#1F1F1F}
#map .sh-st rect{fill:var(--surface);stroke:var(--muted)}#map .sh-st text{fill:var(--ink)}
#map .sh-hist rect{fill:#7A5A2E;stroke:#fff}#map .sh-hist text{fill:#fff}
.lg-road{stroke:var(--roadcase);stroke-width:4;stroke-linecap:round}.lg-park{fill:var(--park);stroke:var(--parkline);stroke-dasharray:2 2}.lg-peak{fill:var(--muted)}

.sky li.wx{display:flex;flex-wrap:wrap;gap:6px}
.wxbtn svg .sig,.netlink svg .sig{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.netlink{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1rem;text-decoration:none;box-shadow:0 2px 8px rgba(20,24,40,.12)}
.netlink svg{width:15px;height:15px}
.netlink:hover{border-color:var(--accent)}

.music{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;margin:0 0 14px;background:var(--surface)}
.music h4{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 6px}
.music h4 svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.music ul{list-style:none;margin:0;padding:0}
.music li{padding:6px 0;border-top:1px solid var(--rule)}
.music li:first-child{border-top:0}
.music .mt{font-family:var(--display);font-weight:600;font-size:1.08rem}
.music .ma{color:var(--muted);font-family:var(--display);font-size:1.02rem}
.music .mn{display:block;font-size:.93rem;color:var(--muted);line-height:1.4}
.music .ml{display:flex;gap:12px;margin-top:2px;font-family:var(--display);font-size:.95rem}
.music .ml a{color:var(--accent)}
.editing .music .mt,.editing .music .ma{display:inline-block;min-width:3em}

<script id="trip-data" type="application/json">{"title":"Vegas, par le chemin des écoliers","subtitle":"Du 3 au 14 novembre 2026, en van","lede":"Valley of Fire, Zion, Bryce, les slot canyons d’Escalante, Capitol Reef, Arches, Canyonlands, Monument Valley, Page et le Grand Canyon, puis retour par la Route 66. Une rando qui vaut vraiment le détour par jour, des réveils vers 7 h, et 8 nuits sur 10 en bivouac gratuit dans la nature.","facts":[["~2 330 km","1 450 mi"],["~28 h","de volant"],["8 nuits sur 10","en bivouac"],["Nouvelle lune","le 9 nov."]],"prepTitle":"Avant le 3 novembre","prepSub":"Les cases cochées sont enregistrées dans ce navigateur uniquement. Tarifs et règles vérifiés auprès des sources officielles le 23 octobre 2026 ; revérifiez tout ce qui dépend des dates la semaine précédant le départ.","todoTitle":"À réserver ou vérifier","notesTitle":"Novembre, mode d’emploi","notes":["\u003cb>Lumière.\u003c/b> Lever vers 7 h 00, coucher vers 17 h 15 en Utah et en Arizona ; au Nevada, l’horloge affiche une heure de moins. Environ 10 h 30 de jour. Avec un réveil vers 7 h, le soleil se lève pendant le café ; le planning vise une arrivée au bivouac avant la nuit, et les rares arrivées de nuit se font sur des spots faciles à trouver.","\u003cb>Bivouac.\u003c/b> Sur les terres du BLM et des forêts nationales, c’est gratuit, sans réservation, limité à 14–16 jours. On s’installe sur un emplacement déjà utilisé (ou désigné, là où c’est indiqué), on remporte tout, y compris le papier toilette, et on respecte les interdictions de feu affichées. Ni eau ni toilettes. Le bivouac en véhicule est interdit dans les parcs nationaux et en terre navajo.","\u003cb>Fuseaux horaires.\u003c/b> Le Nevada est à UTC−8. L’Utah, l’Arizona et la Nation navajo sont tous à UTC−7 en novembre : votre téléphone arrête de changer d’avis une fois sorti du Nevada (en été, la Nation navajo et le reste de l’Arizona ont une heure d’écart).","\u003cb>Ciel noir.\u003c/b> La lune est un croissant décroissant au départ, nouvelle le 9 novembre, et un fin croissant du soir à la fin. Les soirées sont sans lune pendant tout le voyage, et les Taurides du Nord culminent vers les 11–12 novembre : peu de météores, mais connues pour leurs bolides lents et brillants.","\u003cb>Carburant et réseau.\u003c/b> Ne dépassez jamais une station avec moins d’un demi-réservoir sur l’UT-12, l’UT-24 ou l’US-163. Téléchargez des cartes hors ligne pour toute la région ; Escalante, Capitol Reef et Monument Valley sont presque entièrement en zone blanche.","\u003cb>Froid.\u003c/b> Moyennes typiques de novembre, pas des prévisions :"],"weather":{"head":["Lieu","Altitude","Jour","Nuit"],"rows":[["Las Vegas","610 m","~20 °C","~9 °C"],["Canyon de Zion","1 200 m","~16 °C","~3 °C"],["Moab","1 220 m","~14 °C","~0 °C"],["Bord du Grand Canyon","2 100 m","~10 °C","~−5 °C"],["Bord de Bryce","2 400 m","~8 °C","~−7 °C"]]},"todo":[["Maintenant","Hauteur 2,6 m et longueur 6 m, c’est bon pour Zion. Reste à mesurer la largeur d’un rétroviseur à l’autre au retrait du van (limite 2,39 m). C’est ce qui décide de l’itinéraire du jour 4."],["Maintenant","Pistes autorisées par le contrat. Gardez-les pour les jours secs, le van n’est pas un 4×4."],["Avant d’entrer dans Zion","Achetez le pass America the Beautiful non-résident (250 $, couvre le titulaire et trois adultes). Sans lui, chacun de vous paie 100 $ à Zion, à Bryce et au Grand Canyon en plus de l’entrée : 600 $ et plus à deux."],["Maintenant","Watchman Campground, Zion, nuits du 4 et du 5 novembre (Recreation.gov). C’est le seul camping payant du voyage."],["4 nov. avant 15 h 00 MT","Loterie de la veille pour Angels Landing le 5 novembre. Résultats à 16 h 00."],["Maintenant","Visite d’Antelope Canyon, 12 novembre, vers midi."],["À Moab","Toilettes portables ou wag bags, obligatoires dans les zones de bivouac désignées autour de Moab."],["Avant le 3 nov.","Bidons pour ~40 L d’eau : aucun point d’eau aux bivouacs. Remplissez à chaque ville."],["Avant le 3 nov.","Cartes hors ligne du sud de l’Utah et du nord de l’Arizona, plus une appli de bivouac hors ligne (iOverlander, Campendium) pour les spots de secours."],["Avant le 3 nov.","Duvets chauds (nuits jusqu’à −7 °C), microcrampons pour les sentiers verglacés, frontales avec piles neuves."],["Facultatif","Location de combinaisons étanches à Springdale si vous voulez remonter les Narrows le 5 novembre."]],"daysTitle":"Les journées","daysSub":"La bande à côté de chaque jour est une carotte géologique : la roche la plus ancienne que vous toucherez ce jour-là. Le voyage monte de dunes de 190 millions d’années jusqu’à des cheminées de fée de 50 millions d’années, puis finit 1,7 milliard d’années plus bas.","days":[{"n":1,"date":"Mardi 3 nov.","nd":"3 nov.","short":"Valley of Fire","c":"#B5452B","rock":"Grès Aztec, ~190 millions d’années","title":"Clés, courses, première nuit dans le désert","drive":"\u003cb>Las Vegas → Valley of Fire\u003c/b>, 90 km / 55 mi, ~1 h","sky":[["Coucher","16:40 PST"],["Lune","43 %, se lève après minuit"]],"sched":[["15:00","Récupération du van. Avant de signer, mesurez la hauteur, la largeur rétroviseurs compris et la longueur (voir jour 4), et demandez si les pistes non goudronnées sont autorisées : la plupart des bivouacs sont au bout d’une courte piste.",{"n":"Las Vegas","a":"Las Vegas, NV","ll":"36.1716, -115.1391","k":"etape","lab":"Las Vegas"}],["15:45","Une grosse course : eau pour plusieurs jours (aucun point d’eau aux bivouacs), petits-déjeuners, nourriture de rando, cartouche de gaz. Plein d’essence.",null],["16:40","Le soleil se couche pendant que vous êtes au supermarché. C’est comme ça.",null],["17:30","Route vers Valley of Fire. Le bivouac est au bord de la Valley of Fire Highway, ~6 km avant l’entrée ouest : pas besoin d’entrer dans le parc de nuit.",null],["Nuit","Andromède est haute dans le ciel en début de soirée. Dîner, dodo.",null]],"hikes":[],"nerd":["Le rouge, c’est le grès Aztec : une mer de sable jurassique, le même champ de dunes qui forme les falaises de grès Navajo de Zion demain. Ce sont des pellicules d’oxyde de fer sur les grains qui donnent la couleur.","Valley of Fire a été inaugurée en 1935, ce qui en fait le plus ancien parc d’État du Nevada."],"alt":"Si le terrain est plein ou ne vous plaît pas, Snowbird Mesa (Poverty Flats), entre le parc et Overton, est une autre zone gratuite.","sleep":"Bivouac BLM gratuit « Valley of Fire West », au bord de la Valley of Fire Highway (GPS 36.4445, −114.6756). D’autres voyageurs y sont arrivés de nuit et ont trouvé une place sans difficulté.","sleepAt":{"n":"Bivouac Valley of Fire West","a":"Valley of Fire Highway, Overton, NV","ll":"36.4445, -114.6756","k":"camp","lab":""},"music":[["Viva Las Vegas","Elvis Presley","Pour quitter le comptoir de location dans le bon esprit."],["Mr. Brightside","The Killers","Le groupe vient de Las Vegas."]]},{"n":2,"date":"Mercredi 4 nov.","nd":"4 nov.","short":"Zion","c":"#B5452B","rock":"Grès Aztec, ~190 millions d’années","title":"Fire Wave le matin, Zion l’après-midi","drive":"\u003cb>Valley of Fire → Springdale\u003c/b>, 265 km / 165 mi, ~2 h 45, plus une heure perdue au changement de fuseau","sky":[["Lever","06:03 PST, depuis le van"],["Coucher","17:32 MST, Zion"],["Lune","33 %"]],"sched":[["06:45","Le jour se lève sur le désert pendant le café.",null],["07:30","15 minutes jusqu’au Fire Wave, encore dans la lumière rasante : du grès en vagues, rayé comme un berlingot.",{"n":"Fire Wave","a":"Fire Wave Trailhead, Valley of Fire State Park","ll":"36.4848, -114.5279","k":"rando","lab":"Valley of Fire"}],["08:30","Boucle de White Domes.",{"n":"White Domes","a":"White Domes Trail, Valley of Fire State Park","ll":"36.487, -114.533","k":"rando","lab":""}],["09:30","Mouse’s Tank et ses pétroglyphes.",{"n":"Mouse’s Tank","a":"Mouse's Tank Trailhead, Valley of Fire State Park","ll":"36.45, -114.515","k":"rando","lab":""}],["10:30","Route vers Zion par Overton et l’I-15 (gorges de la Virgin River). Les horloges avancent d’une heure en entrant en Arizona.",null],["13:30","Avant 15 h 00 MT : inscrivez-vous sur Recreation.gov à la loterie de la veille pour Angels Landing le 5 novembre. Résultats à 16 h 00.",null],["14:30","Springdale. Centre des visiteurs, pass non-résident, installation au camping.",{"n":"Centre des visiteurs de Zion","a":"Zion Canyon Visitor Center","ll":"37.2002, -112.9866","k":"etape","lab":"Zion"}],["16:00","Pa’rus Trail le long de la rivière, à pied depuis le camping, jusqu’au coucher de soleil sur le Watchman depuis le pont de Canyon Junction.",{"n":"Canyon Junction","a":"Canyon Junction Bridge, Zion National Park","ll":"37.2136, -112.9762","k":"vue","lab":""}]],"hikes":[["Fire Wave","2,4 km / 1,5 mi","Sable plat et slickrock"],["Boucle de White Domes","1,8 km / 1,1 mi","Court passage en slot"],["Mouse’s Tank","1,3 km / 0,8 mi","Pétroglyphes tout du long"],["Pa’rus Trail","~5,6 km / 3,5 mi","Plat, goudronné"]],"nerd":["Atlatl Rock doit son nom au propulseur gravé dessus, une arme antérieure à l’arc dans la région.","En une heure sur l’I-15, vous traversez le Nevada, l’Arizona et l’Utah. En novembre, l’Arizona et l’Utah sont à la même heure ; en été, non."],"alt":"Pas de permis pour Angels Landing : plan B au jour 3.","sleep":"Exception : Watchman Campground (à réserver). Le BLM a décidé en mars 2026 d’interdire le bivouac sur ~14 000 acres autour de Zion (Hurricane Cliffs, Smithsonian Butte, Canaan Mountain) et les règles sont en transition : ne comptez pas sur du gratuit ici. Watchman est à pied de la navette, ce qui vous épargne la course au parking le matin.","sleepAt":{"n":"Watchman Campground","a":"Watchman Campground, Zion National Park","ll":"37.1983, -112.984","k":"campp","lab":""},"music":[["Paris, Texas","Ry Cooder","La guitare slide du désert, parfaite au lever sur le Fire Wave."],["Dreams","Fleetwood Mac","Pour l’I-15 et ses trois États en une heure."]]},{"n":3,"date":"Jeudi 5 nov.","nd":"5 nov.","short":"Zion","c":"#D58B5C","rock":"Grès Navajo, ~190 millions d’années","title":"Zion : une grande rando, pas deux","drive":"\u003cb>Pas de route.\u003c/b> Le canyon de Zion n’est accessible qu’en navette jusqu’à fin novembre.","sky":[["Lever","06:59"],["Coucher","17:31"],["Lune","23 %"]],"sched":[["07:30","Réveil, petit-déjeuner, navette vers 8 h 00 à pied depuis le camping.",null],["08:30","La rando du jour, plan A avec permis : Angels Landing depuis The Grotto. Walter’s Wiggles, Scout Lookout, puis les chaînes. Comptez 4 à 5 h.",{"n":"Angels Landing","a":"The Grotto Trailhead, Zion National Park","ll":"37.2593, -112.9512","k":"rando","lab":""}],["13:30","Pique-nique, puis navette jusqu’au Temple of Sinawava : Riverside Walk jusqu’à l’entrée des Narrows. Remonter la rivière demande une combinaison étanche en novembre ; c’est en option.",{"n":"Temple of Sinawava","a":"Temple of Sinawava, Zion National Park","ll":"37.2853, -112.9477","k":"rando","lab":""}],["16:30","Retour au camping avant la nuit. Pizza à Springdale.",null]],"hikes":[["Angels Landing","8,7 km / 5,4 mi","+454 m, permis, chaînes"],["Riverside Walk","3,5 km / 2,2 mi","Plat"],["Plan B : West Rim après Scout Lookout","Aussi loin que vous voulez","Sans permis"],["Option : The Narrows jusqu’à Wall Street","~12 km / 7,5 mi","Dans la rivière, eau à ~8–10 °C"]],"nerd":["Les falaises sont des dunes fossiles épaisses de ~600 m. Les lignes obliques à l’intérieur (stratifications entrecroisées) sont les flancs de dunes poussées par les vents du Jurassique.","Walter’s Wiggles, 21 lacets serrés, ont été construits en 1926 et portent le nom du premier superintendant de Zion, Walter Ruesch.","À Wall Street, les Narrows font environ 6 à 9 m de large pour des parois de ~300 m. Un orage loin en amont peut provoquer une crue par grand soleil : vérifiez le risque de crue éclair au centre des visiteurs avant d’entrer dans l’eau."],"alt":"Plan B (sans permis) : West Rim Trail jusqu’à Scout Lookout, puis continuez à monter sur le West Rim au lieu de prendre les chaînes. Vue différente, même effort, pas de foule.","sleep":"Watchman Campground, deuxième nuit.","sleepAt":{"n":"Watchman Campground","a":"Watchman Campground, Zion National Park","ll":"37.1983, -112.984","k":"campp","lab":""},"music":[["Holocene","Bon Iver","Pour la descente d’Angels Landing."],["Helplessness Blues","Fleet Foxes","Pour la navette du retour."]]},{"n":4,"date":"Vendredi 6 nov.","nd":"6 nov.","short":"Bryce","c":"#E09AA3","rock":"Formation Claron, ~50 millions d’années","title":"Tunnel, damier, cheminées de fée","drive":"\u003cb>Springdale → Bryce Canyon\u003c/b>, 137 km / 85 mi, ~1 h 50 par le tunnel, ou ~225 km / 140 mi et 2 h 50 via Kanab si le van est trop grand","sky":[["Lever","07:00"],["Coucher","17:26, Bryce Point"],["Lune","15 %, se lève vers 4 h"]],"sched":[["08:00","Départ de Zion vers l’est.",null],["08:30","Canyon Overlook Trail juste après le tunnel (si le van passe), dans la lumière du matin.",{"n":"Canyon Overlook","a":"Canyon Overlook Trail, Zion National Park","ll":"37.2133, -112.9411","k":"rando","lab":""}],["09:15","Arrêt à Checkerboard Mesa, le damier de grès.",{"n":"Checkerboard Mesa","a":"Checkerboard Mesa, Zion National Park","ll":"37.2263, -112.8822","k":"vue","lab":""}],["10:30","US-89 et UT-12 par les arches rocheuses de Red Canyon jusqu’à Bryce.",{"n":"Red Canyon","a":"Red Canyon Visitor Center, Utah","ll":"37.7432, -112.308","k":"vue","lab":""}],["11:30","La rando du jour : le huit Queen’s Garden, Peekaboo, Navajo, au milieu des cheminées de fée.",{"n":"Sunset Point","a":"Sunset Point, Bryce Canyon National Park","ll":"37.6229, -112.1663","k":"rando","lab":"Bryce"}],["15:30","Pause, puis la route panoramique jusqu’à Rainbow Point avec arrêts aux belvédères.",{"n":"Rainbow Point","a":"Rainbow Point, Bryce Canyon National Park","ll":"37.4757, -112.24","k":"vue","lab":""}],["16:45","Coucher de soleil à Bryce Point, puis 20 minutes jusqu’au bivouac.",{"n":"Bryce Point","a":"Bryce Point, Bryce Canyon National Park","ll":"37.604, -112.158","k":"vue","lab":""}],["Nuit","Ciel noir, la lune ne se lève que vers 4 h. Il gèlera franchement à ~2 300 m : tout le monde dans les duvets.",null]],"hikes":[["Canyon Overlook","1,6 km / 1 mi","+50 m"],["Le huit Queen’s Garden, Peekaboo, Navajo","~10,3 km / 6,4 mi","~+490 m"]],"nerd":["Bryce n’est pas un canyon. C’est une série d’amphithéâtres creusés dans les Pink Cliffs, la marche supérieure du Grand Staircase (le « grand escalier »). Dans une semaine, vous serez sur la marche du bas, au Grand Canyon.","Les cheminées de fée naissent de la cryoclastie : l’eau de fonte s’infiltre dans les fissures le jour et gonfle en gelant la nuit, et Bryce connaît ce cycle environ deux cents nuits par an. Novembre est la pleine saison.","Ebenezer Bryce, le colon mormon qui a donné son nom au parc, aurait dit que c’était « un sacré endroit pour perdre une vache ».","Le tunnel Zion–Mt Carmel (1930) fait 1,8 km ; les fenêtres que vous croisez ont été percées pour jeter les déblais directement dans le vide."],"alt":"Depuis le 7 juin 2026, les véhicules de plus de 3,4 m (11′4″) de haut, 2,4 m (7′10″) de large rétroviseurs compris, ou 7,8 m (25′9″) de long sont interdits sur toute la Zion–Mt Carmel Highway, sans possibilité d’escorte. Votre van passe en hauteur (2,6 m) et en longueur (6 m). Les 2,1 m annoncés sont la largeur de caisse, donc mesurez d’un rétroviseur à l’autre. Au-delà de 2,39 m, il faut faire le détour. Si c’est votre cas : oubliez Canyon Overlook et passez par Hurricane → UT-59 → Kanab → US-89 jusqu’à Bryce.","sleep":"Bivouac gratuit sur Tom’s Best Spring Road (FR 117, Dixie National Forest), qui part de l’UT-12 à ~10 km à l’ouest de Bryce (GPS 37.728, −112.2487). Pins ponderosa et prairies ; feux interdits d’après les panneaux sur place.","sleepAt":{"n":"Bivouac Tom’s Best Spring","a":"Tom's Best Spring Road (FR 117), Dixie National Forest","ll":"37.728, -112.2487","k":"camp","lab":""},"music":[["America","Simon &amp; Garfunkel","Pour l’US-89 et ses grands espaces."],["Your Hand in Mine","Explosions in the Sky","Pour le coucher de soleil à Bryce Point."]]},{"n":5,"date":"Samedi 7 nov.","nd":"7 nov.","short":"Escalante","c":"#D58B5C","rock":"Grès Navajo, ~190 millions d’années","title":"La Byway 12 et Calf Creek","drive":"\u003cb>Bryce → Escalante → Calf Creek\u003c/b>, ~105 km / 65 mi, ~1 h 30","sky":[["Lever","06:59"],["Coucher","17:23, le Hogsback"],["Lune","8 %"]],"sched":[["07:30","Réveil dans la forêt. Option : 15 minutes jusqu’à Sunrise Point pour la lumière du matin sur l’amphithéâtre.",{"n":"Sunrise Point","a":"Sunrise Point, Bryce Canyon National Park","ll":"37.6283, -112.1631","k":"vue","lab":""}],["09:00","UT-12 vers l’est, vues sur Powell Point. Café et essence à Escalante ; demandez l’état des pistes au centre des visiteurs.",{"n":"Escalante","a":"Escalante, UT","ll":"37.7702, -111.6024","k":"etape","lab":"Escalante"}],["11:00","La rando du jour : Lower Calf Creek Falls, un canyon sablonneux le long de greniers ancestraux et de pictogrammes à l’ocre rouge, jusqu’à une cascade de 38 m. Pique-nique au pied.",{"n":"Lower Calf Creek Falls","a":"Lower Calf Creek Falls Trailhead","ll":"37.7943, -111.4148","k":"rando","lab":""}],["15:00","Installation au bivouac de Spencer Flat, à quelques minutes.",null],["16:45","Le Hogsback au coucher du soleil, un peu plus à l’est : une route sur une crête, avec du vide des deux côtés.",{"n":"Le Hogsback","a":"Hogsback, Utah Scenic Byway 12","ll":"37.827, -111.402","k":"vue","lab":""}]],"hikes":[["Lower Calf Creek Falls","~10,5 km / 6,5 mi","Plutôt plat, sable mou"],["Option : slots Peekaboo et Spooky","5,6 km / 3,5 mi","Si la piste est praticable"]],"nerd":["L’Escalante a été la dernière rivière des 48 États contigus à être cartographiée, en 1872, par Almon Thompson de l’expédition de John Wesley Powell.","Hole-in-the-Rock Road suit l’expédition mormone de 1879–1880, qui a descendu ses chariots par une fissure dans la falaise pour franchir le Colorado.","Le plateau de Kaiparowits que vous traversez a livré une série de nouveaux dinosaures depuis la création du monument en 1996, dont des cératopsiens aux collerettes extravagantes."],"alt":"Les slots Peekaboo et Spooky sont au bout de 42 km de piste sur Hole-in-the-Rock Road, signalée boueuse et défoncée dans le bulletin du BLM du 16 octobre 2026. Si elle a séché et que la location l’autorise, faites-les le matin et gardez Calf Creek pour l’après-midi.","sleep":"Bivouac gratuit sur Spencer Flat Road, qui part de l’UT-12 vers le mile 70 (Grand Staircase–Escalante). Piste sèche et en bon état au dernier bulletin du BLM. Little Spencer Flat est le secteur le plus proche de la route (GPS 37.7231, −111.4381).","sleepAt":{"n":"Bivouac Spencer Flat","a":"Spencer Flat Road, Escalante, UT","ll":"37.7231, -111.4381","k":"camp","lab":""},"music":[["Big Black Car","Gregory Alan Isakov","Pour la Byway 12, en roulant doucement."],["Harvest Moon","Neil Young","Pour la soirée au bivouac."]]},{"n":6,"date":"Dimanche 8 nov.","nd":"8 nov.","short":"Capitol Reef","c":"#9B3E2A","rock":"Grès Wingate, ~200 millions d’années","title":"Boulder Mountain, Capitol Reef, et les gobelins","drive":"\u003cb>Spencer Flat → Capitol Reef → Goblin Valley\u003c/b>, ~230 km / 145 mi, ~2 h 45","sky":[["Lever","06:58"],["Coucher","~17:15, Goblin Valley"],["Lune","3 %"]],"sched":[["07:30","Café au van, puis l’UT-12 par Boulder et Boulder Mountain (~2 900 m ; attention au verglas). Arrêt au belvédère de Larb Hollow, face au Waterpocket Fold et aux Henry Mountains.",{"n":"Larb Hollow Overlook","a":"Larb Hollow Overlook, Highway 12","ll":"38.048, -111.356","k":"vue","lab":""}],["09:30","Capitol Reef. La rando du jour : Cassidy Arch par Grand Wash.",{"n":"Cassidy Arch","a":"Cassidy Arch Trail, Capitol Reef National Park","ll":"38.2715, -111.2255","k":"rando","lab":""}],["12:30","Pique-nique dans les vergers de Fruita, pétroglyphes sur l’UT-24, tartes de Gifford House si la boutique est encore ouverte.",{"n":"Fruita","a":"Gifford Homestead, Capitol Reef National Park","ll":"38.2818, -111.2475","k":"etape","lab":"Capitol Reef"}],["13:30","UT-24 vers l’est devant Factory Butte. Plein à Hanksville.",{"n":"Factory Butte","a":"Factory Butte, Utah","ll":"38.444, -110.895","k":"vue","lab":""}],["14:00","La Mars Desert Research Station est visible depuis la route (regardez de loin, l’équipage peut être en simulation).",{"n":"Mars Desert Research Station","a":"Mars Desert Research Station","ll":"38.4062, -110.7919","k":"vue","lab":""}],["15:00","Goblin Valley : balade libre parmi les gobelins jusqu’au coucher du soleil.",{"n":"Goblin Valley","a":"Goblin Valley State Park","ll":"38.565, -110.707","k":"rando","lab":"Goblin Valley"}],["17:30","Bivouac à quelques minutes, sous l’un des ciels les plus noirs du voyage.",null]],"hikes":[["Cassidy Arch","5,5 km / 3,4 mi","+204 m"],["Valley of Goblins","À volonté","Errance libre"],["Option : Little Wild Horse Canyon","~6,4 km / 4 mi","Slot sans technique"]],"nerd":["Les Henry Mountains ont été la dernière chaîne des 48 États contigus à être nommée et cartographiée. G. K. Gilbert les a étudiées dans les années 1870 et a inventé le mot laccolite pour ce qu’il y a trouvé : du magma qui a soulevé la roche au-dessus de lui au lieu d’entrer en éruption.","Le Waterpocket Fold est un pli de ~160 km dans la croûte terrestre, un monoclinal. Les premiers voyageurs l’ont appelé reef (récif) parce qu’il bloquait le passage comme un récif en mer ; les dômes blancs de grès Navajo au sommet rappelaient des capitoles.","Goblin Valley a servi de planète extraterrestre dans Galaxy Quest (1999)."],"alt":"En manque d’énergie : Hickman Bridge (2,9 km) au lieu de Cassidy Arch.","sleep":"Bivouac BLM gratuit sur Wild Horse Road, juste à l’extérieur de Goblin Valley State Park, dans le San Rafael Swell. Spot moins documenté que les autres. \u003cb>Plan B payant :\u003c/b> le camping de Goblin Valley State Park, ouvert toute l’année, avec douches (24 emplacements et deux yourtes) ; réservation conseillée.","sleepAt":{"n":"Bivouac Wild Horse Road","a":"Wild Horse Road, Goblin Valley, Utah","ll":"38.588, -110.755","k":"camp","lab":""},"music":[["Life on Mars?","David Bowie","En passant devant la Mars Desert Research Station."],["Rocket Man","Elton John","Goblin Valley a joué une planète extraterrestre dans Galaxy Quest."]]},{"n":7,"date":"Lundi 9 nov.","nd":"9 nov.","short":"Arches","c":"#CF6A34","rock":"Grès Entrada, ~165 millions d’années","title":"Arches, sous la nouvelle lune","drive":"\u003cb>Goblin Valley → Moab → Arches\u003c/b>, ~165 km / 100 mi, ~1 h 45, puis ~65 km dans le parc","sky":[["Lever","06:52"],["Coucher","17:11, Delicate Arch"],["Lune","Nouvelle"]],"sched":[["07:30","Réveil parmi les gobelins, route vers Moab par l’I-70 et l’US-191.",null],["09:30","En passant, jetez un œil à Willow Springs Road, à 15 minutes d’Arches : c’est le bivouac de ce soir.",null],["10:00","Arches (pas de créneau horaire à réserver en 2026) : Windows, Turret Arch et Double Arch.",{"n":"The Windows","a":"The Windows, Arches National Park","ll":"38.6869, -109.537","k":"rando","lab":"Arches"}],["11:30","La rando du jour : Devils Garden jusqu’à Landscape Arch et Double O Arch, aller-retour.",{"n":"Devils Garden","a":"Devils Garden Trailhead, Arches National Park","ll":"38.7829, -109.5949","k":"rando","lab":""}],["15:15","Balanced Rock.",{"n":"Balanced Rock","a":"Balanced Rock, Arches National Park","ll":"38.701, -109.5645","k":"vue","lab":""}],["15:30","Le sentier de Delicate Arch, calé pour le coucher du soleil. Descente à la frontale.",{"n":"Delicate Arch","a":"Delicate Arch Trailhead, Arches National Park","ll":"38.7357, -109.5205","k":"rando","lab":""}],["18:15","Bivouac à Willow Springs. La nuit la plus noire du voyage : guettez les bolides des Taurides.",null]],"hikes":[["Boucle des Windows","1,6 km / 1 mi","Facile"],["Devils Garden jusqu’à Double O","6,8 km / 4,2 mi","Lames de grès, un peu d’escalade"],["Delicate Arch","5,1 km / 3,2 mi","+146 m"]],"nerd":["Les arches existent grâce au sel. D’épais dépôts de sel du bassin de Paradox, sous le parc, ont flué, se sont bombés puis effondrés, fracturant le grès Entrada au-dessus en lames parallèles. L’érosion attaque les lames et des trous apparaissent.","Plus de 2 000 arches sont répertoriées ici ; pour compter, l’ouverture doit faire au moins 3 pieds (~1 m).","Landscape Arch a une portée de ~93 m et est plus fine qu’elle n’en a l’air. Une grosse plaque s’en est détachée en 1991, d’où la fermeture du sentier en dessous."],"alt":"Pour arriver au bivouac avant la nuit : faites Delicate Arch en fin de matinée et regardez le coucher depuis le van.","sleep":"Willow Springs Road, au nord de Moab : emplacements désignés gratuits uniquement (on s’installe sur un site signalé, pas ailleurs). Dans les zones désignées autour de Moab, toilettes portables ou sacs à déchets (wag bags) obligatoires : achetez-en en ville.","sleepAt":{"n":"Bivouac Willow Springs","a":"Willow Springs Road, Moab, UT","ll":"38.693, -109.693","k":"camp","lab":""},"music":[["Eclipse","Pink Floyd","Nuit de nouvelle lune : The Dark Side of the Moon, évidemment."],["Brain Damage","Pink Floyd","Le morceau qui précède Eclipse, à écouter dans l’ordre."]]},{"n":8,"date":"Mardi 10 nov.","nd":"10 nov.","short":"Canyonlands","c":"#CDBFA3","rock":"Grès White Rim, ~270 millions d’années","title":"Island in the Sky, sans réveil","drive":"\u003cb>Moab → Island in the Sky\u003c/b>, 50 km / 32 mi, ~40 min","sky":[["Lever","06:54"],["Coucher","17:12, Dead Horse Point"],["Lune","Nouvelle, rien dans le ciel"]],"sched":[["08:00","Café, puis route vers Canyonlands.",null],["08:45","Mesa Arch : la lumière du matin est encore belle sous l’arche, sans la foule du lever.",{"n":"Mesa Arch","a":"Mesa Arch, Canyonlands National Park","ll":"38.3893, -109.8681","k":"vue","lab":""}],["09:30","La rando du jour : Grand View Point Trail jusqu’au bout du plateau.",{"n":"Grand View Point","a":"Grand View Point Overlook, Canyonlands National Park","ll":"38.311, -109.857","k":"rando","lab":"Canyonlands"}],["11:30","Le premier belvédère d’Upheaval Dome.",{"n":"Upheaval Dome","a":"Upheaval Dome Trailhead, Canyonlands National Park","ll":"38.4277, -109.9265","k":"rando","lab":""}],["13:00","Pique-nique à Green River Overlook.",{"n":"Green River Overlook","a":"Green River Overlook, Canyonlands National Park","ll":"38.37, -109.889","k":"vue","lab":""}],["14:00","Shafer Canyon Overlook (les 4×4 qui rampent dans les lacets).",{"n":"Shafer Canyon Overlook","a":"Shafer Canyon Overlook, Canyonlands National Park","ll":"38.458, -109.809","k":"vue","lab":""}],["15:00","Option : Mill Canyon Dinosaur Trackway, au nord de l’embranchement, ou une sieste.",{"n":"Mill Canyon Dinosaur Trackway","a":"Mill Canyon Dinosaur Trackway, Moab, UT","ll":"","k":"vue","lab":""}],["16:30","Dead Horse Point State Park (droit d’entrée à part) pour le coucher sur le méandre du Colorado. Bivouac à quelques minutes.",{"n":"Dead Horse Point","a":"Dead Horse Point State Park","ll":"38.4706, -109.74","k":"vue","lab":""}]],"hikes":[["Mesa Arch","0,8 km / 0,5 mi","Facile"],["Grand View Point","3,2 km / 2 mi","Le long du rebord"],["Upheaval Dome, premier belvédère","~1,6 km / 1 mi","Court, un peu de montée"]],"nerd":["Upheaval Dome a fait débat pendant des décennies : bulle de sel remontée ou cratère d’impact érodé ? Du quartz choqué trouvé dans ses roches fait pencher la balance vers une météorite.","Les bassins bleu vif visibles depuis Dead Horse Point sont des bassins d’évaporation de potasse, teintés en bleu pour absorber plus de soleil et sécher plus vite.","La scène finale de Thelma et Louise a été tournée près de Dead Horse Point, pas au Grand Canyon."],"alt":"Envie d’une vraie grosse journée : la Syncline Loop d’Upheaval Dome (13,4 km, +457 m) remplace Grand View et la pause de l’après-midi.","sleep":"Emplacements désignés gratuits du BLM le long de l’UT-313 (secteur Gemini Bridges), sur la route de Dead Horse Point, ou retour à Willow Springs. Mêmes règles : site signalé, toilettes portables. Spots moins documentés que les autres. \u003cb>Plan B payant :\u003c/b> les campings de Dead Horse Point State Park (réservables), Horsethief Campground (BLM, sur l’UT-313) ou Willow Flat dans Canyonlands (12 emplacements, sans réservation, sans eau).","sleepAt":{"n":"Bivouac UT-313","a":"Gemini Bridges Road, Moab, UT","ll":"38.53, -109.73","k":"camp","lab":""},"music":[["Part of Me, Part of You","Glenn Frey","Le thème de Thelma et Louise, tourné près de Dead Horse Point."],["Better Not Look Down","B.B. King","Aussi dans la bande originale du film. Titre de circonstance au bord du plateau."]]},{"n":9,"date":"Mercredi 11 nov.","nd":"11 nov.","short":"Monument Valley","c":"#C0502F","rock":"Grès De Chelly, ~270 millions d’années","title":"Monument Valley, puis la Vallée des Dieux","drive":"\u003cb>Moab → Bluff → Monument Valley → Valley of the Gods\u003c/b>, ~380 km / 235 mi, ~4 h 30","sky":[["Lever","06:55"],["Coucher","17:15, Valley of the Gods"],["Lune","2 %"]],"sched":[["07:45","Départ de Moab. Wilson Arch au bord de la route.",{"n":"Wilson Arch","a":"Wilson Arch, Utah","ll":"38.2263, -109.3653","k":"vue","lab":""}],["09:45","Bluff : panneau de pétroglyphes de Sand Island au bord de la San Juan, café.",{"n":"Sand Island","a":"Sand Island Petroglyph Panel, Bluff, UT","ll":"37.261, -109.614","k":"vue","lab":""}],["11:00","Goosenecks State Park : la San Juan dans un méandre encaissé de 300 m.",{"n":"Goosenecks","a":"Goosenecks State Park, Utah","ll":"37.1747, -109.927","k":"vue","lab":""}],["11:45","Le rocher de Mexican Hat.",{"n":"Mexican Hat","a":"Mexican Hat Rock, Utah","ll":"37.166, -109.855","k":"vue","lab":""}],["12:00","Forrest Gump Point sur l’US-163.",{"n":"Forrest Gump Point","a":"Forrest Gump Point, US-163","ll":"37.1009, -109.9918","k":"vue","lab":""}],["12:30","Monument Valley Navajo Tribal Park (droit d’entrée tribal ; le pass national ne s’applique pas). La rando du jour : Wildcat Trail autour de West Mitten.",{"n":"Monument Valley","a":"Monument Valley Navajo Tribal Park Visitor Center","ll":"36.984, -110.112","k":"rando","lab":"Monument Valley"}],["15:00","Retour vers le nord, ~45 minutes, jusqu’à Valley of the Gods.",null],["16:00","Choisissez votre butte, installez-vous, coucher de soleil depuis le van.",null]],"hikes":[["Wildcat Trail","5,1 km / 3,2 mi","La seule rando en autonomie dans la vallée"]],"nerd":["Aux Goosenecks, la rivière fait environ 10 km de boucles pour avancer de 2,5 km. Elle s’est enfoncée en gardant son ancien tracé de rivière paresseuse : c’est ça, un méandre encaissé.","Juste au-dessus de Valley of the Gods, la Moki Dugway (UT-261), c’est ~5 km de lacets en gravier qui montent de 335 m, construits en 1958 pour les camions de minerai d’uranium. Muley Point, en haut, a l’une des plus belles vues de la région.","Les buttes sont en grès De Chelly posé sur un schiste tendre, protégé par une couche dure au sommet. Retirez le chapeau et la butte devient aiguille, puis plus rien."],"alt":"Vous tenez aux Mittens au coucher du soleil : restez à Monument Valley jusqu’à 17 h 15 et dormez dans la zone gratuite près du rocher de Mexican Hat, à ~30 minutes. Le bivouac libre n’est pas autorisé en terre navajo, donc pas sur place.","sleep":"Valley of the Gods (BLM, gratuit, sans permis) : emplacements le long de la piste de 27 km, les plus faciles près des entrées. Piste en gravier, à vérifier avec le contrat (GPS 37.3158, −109.851).","sleepAt":{"n":"Bivouac Valley of the Gods","a":"Valley of the Gods Road, Mexican Hat, UT","ll":"37.3158, -109.851","k":"camp","lab":""},"music":[["Running on Empty","Jackson Browne","Dans la bande originale de Forrest Gump, pour le Forrest Gump Point."],["The Good, the Bad and the Ugly","Ennio Morricone","Pour l’arrivée face aux Mittens."]]},{"n":10,"date":"Jeudi 12 nov.","nd":"12 nov.","short":"Page et Grand Canyon","c":"#E0A06C","rock":"Calcaire Kaibab, ~270 millions d’années","title":"Antelope Canyon, puis le rebord","drive":"\u003cb>Valley of the Gods → Page → Grand Canyon\u003c/b>, ~420 km / 260 mi, ~5 h","sky":[["Lever","07:00, entre les buttes"],["Coucher","17:24, Lipan Point"],["Lune","6 %, se couche tôt"]],"sched":[["07:30","Réveil entre les buttes, départ par Monument Valley et Kayenta (les Mittens dans la lumière du matin depuis la route).",{"n":"Kayenta","a":"Kayenta, AZ","ll":"36.7272, -110.2546","k":"etape","lab":""}],["10:30","Page : Horseshoe Bend (parking payant, géré par la ville).",{"n":"Horseshoe Bend","a":"Horseshoe Bend, Page, AZ","ll":"36.8791, -111.5104","k":"rando","lab":""}],["12:00","Antelope Canyon, uniquement avec un guide navajo (réservé à l’avance). Midi est le meilleur moment pour la lumière dans le slot.",{"n":"Antelope Canyon","a":"Antelope Canyon, Page, AZ","ll":"36.903, -111.414","k":"rando","lab":"Page"}],["13:30","Déjeuner, puis US-89 vers le sud.",null],["15:30","Entrée par Desert View : la Watchtower de Mary Colter (1932), Navajo Point.",{"n":"Desert View Watchtower","a":"Desert View Watchtower, Grand Canyon","ll":"36.0441, -111.8261","k":"vue","lab":""}],["17:24","Coucher de soleil à Lipan Point, puis ~50 minutes jusqu’au bivouac de Tusayan.",{"n":"Lipan Point","a":"Lipan Point, Grand Canyon","ll":"36.0329, -111.858","k":"vue","lab":""}]],"hikes":[["Horseshoe Bend","2,4 km / 1,5 mi","Goudronné, facile"],["Visite d’Antelope Canyon","~1 h","Guidée"]],"nerd":["Le barrage de Glen Canyon fait 216 m de haut. Le lac Powell a mis 17 ans à se remplir, de 1963 à 1980.","Depuis Lipan Point, on voit la Grande Discordance : du grès horizontal de ~500 millions d’années posé directement sur une roche de ~1,7 milliard d’années. Plus d’un milliard d’années d’histoire ont tout simplement disparu.","Sous Lipan, on voit aussi les couches inclinées du Grand Canyon Supergroup, restes de montagnes arasées avant le dépôt des couches horizontales."],"alt":"Plus de place pour Antelope : les visites d’Antelope Canyon X ou de Waterholes Canyon se font en petits groupes et sont généralement moins prises d’assaut.","sleep":"Kaibab National Forest, gratuit et sans permis : Long Jim Loop, au bord de Tusayan (GPS 35.9788, −112.1302), ou la Forest Road 302 juste à côté. Les pistes partent du village, faciles à trouver de nuit. Pas de bivouac à moins de ~1,6 km des terrains aménagés ; évitez après la pluie ou la neige (boue).","sleepAt":{"n":"Bivouac Long Jim Loop","a":"Long Jim Loop, Tusayan, AZ","ll":"35.9788, -112.1302","k":"camp","lab":""},"music":[["Grand Canyon Suite","Ferde Grofé","Suite symphonique de 1931 inspirée du canyon ; ses mouvements « Sunrise » et « Sunset » collent aux belvédères."],["A Horse with No Name","America","Pour la longue route entre Kayenta et Page."]]},{"n":11,"date":"Vendredi 13 nov.","nd":"13 nov.","short":"Route 66","c":"#4F4A57","rock":"Schiste de Vishnu, ~1,75 milliard d’années","title":"Sous le rebord, puis la Route 66","drive":"\u003cb>Grand Canyon → Williams → Seligman → Kingman → Hoover Dam → Las Vegas\u003c/b>, ~480 km / 300 mi, ~5 h plus les arrêts ; on recule d’une heure au Nevada","sky":[["Lever","07:02, depuis les pins"],["Coucher","16:35 PST, Hoover Dam"],["Lune","12 %"]],"sched":[["07:00","Réveil dans les pins, 20 minutes jusqu’au rebord.",null],["08:00","Navette orange jusqu’au départ du South Kaibab (voitures particulières interdites).",null],["08:15","La rando du jour : South Kaibab jusqu’à Cedar Ridge, la plus belle vue pour l’effort au Grand Canyon. Pas d’eau sur ce sentier.",{"n":"South Kaibab","a":"South Kaibab Trailhead, Grand Canyon","ll":"36.053, -112.0839","k":"rando","lab":""}],["11:00","Trail of Time le long du rebord jusqu’au Yavapai Geology Museum.",{"n":"Yavapai Geology Museum","a":"Yavapai Geology Museum, Grand Canyon","ll":"36.0659, -112.1172","k":"vue","lab":"Grand Canyon"}],["12:30","Départ par Tusayan. Plein à Williams.",{"n":"Williams","a":"Williams, AZ","ll":"35.2495, -112.191","k":"etape","lab":""}],["14:15","Seligman, berceau de la renaissance de la Route 66.",{"n":"Seligman","a":"Seligman, AZ","ll":"35.3256, -112.8738","k":"etape","lab":""}],["15:15","Hackberry General Store, sur la Route 66.",{"n":"Hackberry General Store","a":"Hackberry General Store, Arizona","ll":"35.369, -113.724","k":"etape","lab":""}],["15:45 MST","Kingman, puis passage au Nevada : on gagne une heure.",{"n":"Kingman","a":"Kingman, AZ","ll":"35.1894, -114.053","k":"etape","lab":"Kingman"}],["16:00 PST","À pied sur le pont de contournement du barrage Hoover pour le coucher du soleil.",{"n":"Pont du barrage Hoover","a":"Mike O'Callaghan–Pat Tillman Memorial Bridge","ll":"36.0123, -114.742","k":"vue","lab":"Hoover Dam"}],["18:00","Las Vegas. Vider et nettoyer le van.",{"n":"Las Vegas","a":"Las Vegas, NV","ll":"36.1716, -115.1391","k":"etape","lab":""}]],"hikes":[["South Kaibab jusqu’à Ooh Aah Point","2,9 km / 1,8 mi","−240 m, puis la remontée"],["South Kaibab jusqu’à Cedar Ridge","4,8 km / 3 mi","−341 m, puis la remontée"]],"nerd":["Sur le Trail of Time, chaque mètre parcouru équivaut à un million d’années ; des repères en bronze décomptent jusqu’au schiste de Vishnu, ~1,75 milliard d’années, au niveau du fleuve.","Le rebord est en calcaire Kaibab, la même couche qui forme la base du Grand Staircase sous Zion et Bryce. Cherchez des brachiopodes fossiles et des tiges de crinoïdes dans les roches à vos pieds.","Angel Delgadillo, barbier à Seligman, a fondé la Historic Route 66 Association en 1987 et obtenu la protection de la route. Pixar l’a interviewé en préparant Cars.","Les tours de prise d’eau du barrage Hoover portent deux horloges, une à l’heure du Nevada et une à l’heure de l’Arizona. En novembre, elles ont une heure d’écart."],"alt":"En forme : Skeleton Point (9,7 km, −622 m) au lieu de Cedar Ridge, comptez 1 h 30 de plus. N’essayez pas l’aller-retour jusqu’au fleuve dans la journée ; le parc le déconseille fortement.","sleep":"Las Vegas.","sleepAt":null,"music":[["(Get Your Kicks on) Route 66","Nat King Cole","La version de 1946, pour Seligman et Hackberry."],["Life Is a Highway","Rascal Flatts","La version du film Cars, inspiré en partie par Seligman."],["When You Were Young","The Killers","Pour l’arrivée sur Las Vegas."]]},{"n":12,"date":"Samedi 14 nov.","nd":"14 nov.","short":"Retour","c":"#6C717B","rock":"Asphalte","title":"Rendre le van","drive":"\u003cb>Dans Las Vegas\u003c/b>","sky":[],"sched":[["Matin","Seulement si le retour est à midi : vidange des réservoirs, recharge du propane et plein au niveau convenu, photos du van, retour avant 12 h 00.",null]],"hikes":[],"nerd":[],"alt":"","sleep":"","sleepAt":null,"music":[["Leaving Las Vegas","Sheryl Crow","Pour rendre les clés."]]}],"avisTitle":"Notes sur l’itinéraire","avis":["Honnêtement, c’est un très bon itinéraire. La boucle est cohérente, novembre est un excellent choix (peu de monde, températures idéales pour marcher), et vous avez de la chance avec la nouvelle lune pile au milieu du voyage. Le fil géologique, du grès de Zion jusqu’au fond du Grand Canyon, donne en plus une vraie histoire au trajet. Les journées Escalante et Capitol Reef / Goblin Valley sont pour moi les plus sous-estimées : moins connues, mais parmi les plus belles.","Il y a quand même trois choses que je changerais ou surveillerais.","\u003cb>Le Grand Canyon est le parent pauvre.\u003c/b> C’est le site le plus spectaculaire du voyage, et il n’a qu’un coucher de soleil et une matinée, après une journée 10 chargée (Monument Valley → Page → Antelope → Grand Canyon, environ 5 h de route). Si je devais couper quelque chose, ce serait Page. Antelope Canyon est magnifique, mais c’est une visite guidée chère, très fréquentée, et sans les faisceaux de lumière en novembre. En allant directement de Monument Valley au Grand Canyon par Cameron (environ 3 h), vous gagnez un vrai après-midi sur le rebord, et le jour 10 devient reposant.","\u003cb>Le froid des bivouacs en altitude.\u003c/b> Les nuits près de Bryce (vers 2 300 m) et du Grand Canyon (vers 2 000 m) descendent sous les −5 °C, et la neige est possible dès novembre sur Boulder Mountain, Bryce et le rebord sud. Demandez au loueur si le van a un chauffage autonome (diesel ou gaz) qui tourne moteur coupé. Sans chauffage, ces nuits seront dures même avec de bons duvets.","\u003cb>Le van décide de beaucoup de choses.\u003c/b> La hauteur et la longueur sont bonnes pour le tunnel de Zion, et les pistes sont autorisées par le contrat. Restent deux réponses à obtenir avant le 3 novembre, pas au comptoir : la largeur d’un rétroviseur à l’autre (limite 2,39 m pour le tunnel) et le chauffage.","\u003cb>Transparence sur les recherches.\u003c/b> Les bivouacs de Bryce, du Grand Canyon, de Valley of the Gods et de Valley of Fire sont bien documentés. Ceux de Goblin Valley et de l’UT-313 reposent surtout sur des avis de voyageurs. Gardez une appli comme iOverlander hors ligne comme filet de sécurité.","\u003cb>Verdict :\u003c/b> ambitieux mais faisable au rythme actuel."],"footer":["Vérifié le 23 octobre 2026 : la surtaxe non-résident de 100 $ à Zion, Bryce et au Grand Canyon (Arches, Canyonlands et Capitol Reef en sont exemptés) et le pass annuel non-résident à 250 $ ; pas de réservation horaire à Arches en 2026 ; interdiction des grands véhicules sur la Zion–Mt Carmel Highway depuis le 7 juin 2026 ; navette de Zion en service jusqu’à fin novembre ; horaires de la loterie de la veille pour Angels Landing ; camping de Desert View fermé pour la saison ; fermeture au bivouac de ~14 000 acres autour de Zion décidée en mars 2026 ; Spencer Flat sèche et Hole-in-the-Rock boueuse au bulletin du BLM du 16 octobre 2026. Les spots de bivouac sont des zones connues et autorisées au moment de la vérification ; les règles locales changent, lisez les panneaux à l’entrée. Distances et temps de trajet approximatifs. Les distances de randonnée sont en aller-retour.","Retour du van : « 12am » le 14 novembre signifie strictement minuit entre le 13 et le 14. Le programme vous ramène à Vegas le soir du 13, donc ça marche dans les deux cas ; si c’est en fait midi, vous aurez une matinée tranquille."],"contractTitle":"Notes sur le contrat de location","contract":["Lecture du contrat Travellers Autobarn (version du 8 mai 2026, location au départ du Nevada). Ces notes ne sont pas un avis juridique ; en cas de doute, c’est le texte du contrat qui fait foi.","\u003cb>Les pistes, le point bloquant.\u003c/b> L’article 18.1 n’autorise que les routes goudronnées et les voies d’accès bien entretenues de moins de 500 yards (~450 m) menant à des campings ou parkings reconnus. Rouler ailleurs peut annuler l’assurance et la CDW, et vous rendre responsables de la totalité des dégâts. Un accord oral ne compte pas (article 31.2) : il faut une confirmation écrite. Le van peut être géolocalisé (article 27).","\u003cb>Bivouacs concernés.\u003c/b> Tom’s Best Spring, Spencer Flat, Wild Horse Road, Willow Springs, l’UT-313, Valley of the Gods et Long Jim Loop / FR 302 sont au bout de pistes de plus de 450 m, comme les options Hole-in-the-Rock et Valley Drive. Valley of Fire West est peut-être assez proche de la route, à vérifier sur place. Les campings payants du planning (Watchman, Goblin Valley State Park, Dead Horse Point, Mather) sont accessibles par le goudron.","\u003cb>CDW et assurance.\u003c/b> Sans CDW, vous êtes responsables de tous les dégâts (météo, route, vandalisme), plus l’immobilisation du van, le remorquage et les frais administratifs. La CDW saute en cas de conducteur non déclaré, de dégâts liés à une piste, de remorquage ou de sortie des États autorisés : Nevada, Arizona, Californie, Idaho, Oregon et Utah. Donc pas de crochet par le Colorado ni le Nouveau-Mexique (Four Corners, Mesa Verde). La responsabilité civile incluse est au minimum légal de chaque État ; la SLI (jusqu’à 500 000 $) vaut d’être étudiée. Vérifiez aussi votre carte bancaire : beaucoup de cartes françaises excluent les campervans.","\u003cb>Conducteurs.\u003c/b> Avec un permis français, permis international ou traduction certifiée en anglais obligatoire (article 8.1.2). Les deux conducteurs doivent avoir au moins 21 ans, être inscrits sur le contrat et le signer.","\u003cb>Dates et modifications.\u003c/b> Prise en charge de 9 h à 16 h du lundi au samedi : le mardi 3 novembre à 15 h passe. Retour avant 15 h du lundi au samedi : le samedi 14 novembre convient. Au-delà de 59 minutes de tolérance, 250 $ de pénalité puis 250 $ par jour. À moins de 14 jours du départ, chaque modification de réservation coûte 250 $, raccourcir la location ne donne aucun remboursement, et une prolongation demande un accord écrit.","\u003cb>Pendant le voyage.\u003c/b> Vérifier les niveaux et les pneus chaque jour, et signaler toute anomalie sous 24 h. Réparations jusqu’à 100 $ sans accord, au-delà accord écrit préalable. Les dépannages dus à une erreur (panne d’essence, crevaison, batterie vide, enlisement) sont à vos frais. Assistance réduite le dimanche 8 novembre (Capitol Reef et Goblin Valley, zone isolée) et le mercredi 11 novembre (Veterans Day). Les tunnels qui restreignent le propane sont interdits (article 9.2.3) : à vérifier au comptoir pour celui de Zion.","\u003cb>Frais au retour.\u003c/b> Plein d’essence manquant : prix local + 50 $. Propane pas plein : 50 $. Van non lavé et non aspiré : 100 $ (au moins 200 $ s’il est très sale). Les cartes Visa, Mastercard et Amex entraînent 4 % de frais par transaction. Interdits à bord : bougies, spirales anti-moustiques, cigarette et vapotage.","\u003cb>À demander par écrit avant le 3 novembre.\u003c/b> La tolérance exacte pour les pistes menant aux bivouacs, le prix de la CDW et de la SLI au départ du Nevada, et la largeur du van rétroviseurs compris."]}</script>
<script id="app">(function(){

var root = document.getElementById("root");
var bar = document.getElementById("editbar");
var editing = false, art = null, readOnly = false, saving = false, io = null, dlApi = null;
var FILE_NAME = "road-trip-vegas-novembre-2026.html";

  var d = new Date(), z = function(v){ return (v < 10 ? "0" : "") + v; };
  return "road-trip-vegas-novembre-2026_" + d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) + "_" + z(d.getHours()) + "h" + z(d.getMinutes()) + ".html";
}

var BASE_HASH = hashStr(DATA_SRC);

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function plain(html){ var t = document.createElement("template"); t.innerHTML = html || ""; return t.content.textContent; }
function E(path, html, tag, cls){
  tag = tag || "span";
  return "<" + tag + (cls ? ' class="' + cls + '"' : "") + ' data-path="' + path + '"' + (editing ? ' contenteditable="true"' : "") + ">" + (html == null ? "" : html) + "</" + tag + ">";
}
function ADD(list, label){ return editing ? '<button type="button" class="add" data-add="' + list + '">+ ' + label + "</button>" : ""; }
function DEL(path){ return editing ? '<button type="button" class="del" data-del="' + path + '" aria-label="Supprimer" title="Supprimer">×</button>' : ""; }

/* per-viewer checklist ticks */
var store = {
  get: function(k){ try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch(e){ return {}; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
var done = store.get("sw-loop-todo");

function renderTodo(){
  var h = '<ul class="check">';
  data.todo.forEach(function(t, i){
    if (editing) {
      h += '<li class="row"><div>' + E("todo." + i + ".0", t[0], "span", "when") + E("todo." + i + ".1", t[1], "span", "txt") + "</div>" + DEL("todo." + i) + "</li>";
    } else {
      h += '<li><label><input type="checkbox" data-i="' + i + '"' + (done[i] ? " checked" : "") + "><span><span class=\"when\">" + t[0] + "</span>" + t[1] + "</span></label></li>";
    }
  });
  return h + "</ul>" + ADD("todo", "Ajouter une tâche");
}

function renderDay(d, i){
  var p = "days." + i;
  var h = '<article class="day" id="day' + d.n + '" style="--c:' + d.c + '">';
  h += '<div class="core"><div class="num">' + d.n + "</div>" + E(p + ".date", d.date, "div", "date") +
       '<div class="sample" role="img" aria-label="' + esc(plain(d.rock)) + '"></div>' + E(p + ".rock", d.rock, "div", "rock") + "</div>";
  h += "<div>" + E(p + ".title", d.title, "h3") + E(p + ".drive", d.drive, "p", "drive");
  if (d.sky.length || editing) {
    h += '<ul class="sky">' + d.sky.map(function(s, j){ return "<li>" + E(p + ".sky." + j + ".0", s[0], "span", "lab") + " " + E(p + ".sky." + j + ".1", s[1]) + DEL(p + ".sky." + j) + "</li>"; }).join("") + (editing ? "" : weatherLi(d)) + "</ul>";
    if (editing) h += ADD(p + ".sky", "Ajouter une info");
  }
  h += '<div class="cols"><div><ol class="sched">' + d.sched.map(function(s, j){
    var pp = p + ".sched." + j;
    return "<li>" + E(pp + ".0", s[0], "time") + '<div class="sc">' + E(pp + ".1", s[1]) + (editing ? placeEdit(s[2], pp + ".2") : placeView(s[2], MAP.idFor(d.n, j))) + "</div>" + DEL(pp) + "</li>";
  }).join("") + "</ol>" + ADD(p + ".sched", "Ajouter une étape") + "</div><div>";
  if (d.hikes.length || editing) {
    h += '<table class="hikes"><caption>Randonnées</caption><tbody>' + d.hikes.map(function(r, j){
      return "<tr>" + E(p + ".hikes." + j + ".0", r[0], "td") + E(p + ".hikes." + j + ".1", r[1], "td", "n") + E(p + ".hikes." + j + ".2", r[2], "td", "n") + (editing ? "<td>" + DEL(p + ".hikes." + j) + "</td>" : "") + "</tr>";
    }).join("") + "</tbody></table>" + ADD(p + ".hikes", "Ajouter une rando");
  }
  if (d.nerd.length || editing) {
    h += '<div class="nerd"><h4>Le coin nerd</h4><ul>' + d.nerd.map(function(x, j){ return "<li>" + E(p + ".nerd." + j, x) + DEL(p + ".nerd." + j) + "</li>"; }).join("") + "</ul>" + ADD(p + ".nerd", "Ajouter une note") + "</div>";
  }
  if ((d.music && d.music.length) || editing) {
    var mu = d.music || [];
    h += '<div class="music"><h4><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.2V3.5l7-1.5v8.4"/><circle cx="4.4" cy="12.2" r="1.6"/><circle cx="11.4" cy="10.4" r="1.6"/></svg>La bande-son du jour</h4><ul>' + mu.map(function(m, j){
      var q = encodeURIComponent(plain(m[0]) + " " + plain(m[1])), mp = p + ".music." + j;
      return "<li>" + (editing ? E(mp + ".0", m[0], "span", "mt") + " " + E(mp + ".1", m[1], "span", "ma") + E(mp + ".2", m[2], "span", "mn") + DEL(mp)
        : '<span class="mt">' + m[0] + '</span> <span class="ma">' + m[1] + "</span>" + (m[2] ? '<span class="mn">' + m[2] + "</span>" : "") +
          '<span class="ml"><a href="https://www.youtube.com/results?search_query=' + q + '" target="_blank" rel="noopener">YouTube</a></span>') + "</li>";
    }).join("") + "</ul>" + ADD(p + ".music", "Ajouter un morceau") + "</div>";
  }
  if (d.alt || editing) h += '<div class="alt"><h4>Si les plans changent</h4>' + E(p + ".alt", d.alt, "p") + "</div>";
  if (d.sleep || d.sleepAt || editing) h += '<div class="sleepbox"><p class="sleep"><b>Dormir\u202f:</b> ' + E(p + ".sleep", d.sleep) + "</p>" + (editing ? placeEdit(d.sleepAt, p + ".sleepAt") : placeView(d.sleepAt, "d" + d.n + "n")) + "</div>";
  return h + "</div></div></div></article>";
}

function render(){
  var h = '<header class="wrap hero"><div><h1>' + E("title", data.title, "span", "h1main") + E("subtitle", data.subtitle, "span", "h1sub") + "</h1>" +
    E("lede", data.lede, "p", "lede") + '<ul class="facts">' + data.facts.map(function(f, i){ return "<li>" + E("facts." + i + ".0", f[0], "b") + " " + E("facts." + i + ".1", f[1]) + "</li>"; }).join("") + "</ul></div>" +
    '</header>' + MAP.markup();

    return '<li><a href="#day' + d.n + '" style="--c:' + d.c + '" data-n="' + d.n + '"><b>' + d.n + "</b><small>" + d.nd + "</small><small>" + d.short + "</small></a></li>";
  }).join("") + "</ol></nav>";
  h += '<main class="wrap"><h2 class="sec" id="prep">' + E("prepTitle", data.prepTitle) + "</h2>" + E("prepSub", data.prepSub, "p", "sub");
  h += '<div class="prep"><section class="panel"><h3>' + E("todoTitle", data.todoTitle) + "</h3>" + renderTodo() + "</section>";
  h += '<section class="panel notes"><h3>' + E("notesTitle", data.notesTitle) + "</h3>" + data.notes.map(function(x, i){
    return '<p class="' + (editing ? "row" : "") + '">' + E("notes." + i, x) + DEL("notes." + i) + "</p>";
  }).join("") + ADD("notes", "Ajouter un paragraphe");
  h += '<div class="scroll"><table class="weather"><thead><tr>' + data.weather.head.map(function(x, j){ return E("weather.head." + j, x, "th"); }).join("") + "</tr></thead><tbody>" +
    data.weather.rows.map(function(r, i){ return "<tr>" + r.map(function(c, j){ return E("weather.rows." + i + "." + j, c, "td"); }).join("") + "</tr>"; }).join("") + "</tbody></table></div></section></div>";
  h += '<h2 class="sec">' + E("daysTitle", data.daysTitle) + "</h2>" + E("daysSub", data.daysSub, "p", "sub") + '<div id="days">' + data.days.map(renderDay).join("") + "</div>";
  h += '<h2 class="sec" id="avis">' + E("avisTitle", data.avisTitle) + '</h2><section class="panel notes avis">' + data.avis.map(function(x, i){
    return '<p class="' + (editing ? "row" : "") + '">' + E("avis." + i, x) + DEL("avis." + i) + "</p>";
  }).join("") + ADD("avis", "Ajouter un paragraphe") + "</section>";
  if (data.contract) h += '<h2 class="sec" id="contrat">' + E("contractTitle", data.contractTitle) + '</h2><section class="panel notes avis">' + data.contract.map(function(x, i){
    return '<p class="' + (editing ? "row" : "") + '">' + E("contract." + i, x) + DEL("contract." + i) + "</p>";
