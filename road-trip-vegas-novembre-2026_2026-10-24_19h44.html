function renderBar(){
  if (!art || readOnly) {
    var ex = canExport() ? '<button type="button" data-act="export">' + EXP_ICON + "Exporter</button>" : "";
    bar.hidden = !msg && !ex;
    bar.innerHTML = (msg ? '<span class="msg">' + msg + "</span>" : "") + ex;
    return;
  }
  bar.hidden = false;
  var draft = null;
  try { draft = sessionStorage.getItem("trip-draft"); } catch(e){}
  if (!editing && draft) {
    bar.innerHTML = '<span class="msg">Des modifications non enregistrées ont été retrouvées.</span><button type="button" class="primary" data-act="restore">Restaurer</button><button type="button" data-act="drop">Ignorer</button>';
  } else if (!editing) {
    bar.innerHTML = (msg ? '<span class="msg">' + msg + "</span>" : "") + '<button type="button" class="primary" data-act="edit">✎ Modifier la page</button>' + (canExport() ? '<button type="button" data-act="export" title="Télécharger la page avec vos modifications enregistrées">' + EXP_ICON + "Exporter</button>" : "");
  } else {
    bar.innerHTML = '<span class="msg">' + (msg || "Cliquez sur un texte pour le modifier. Ctrl+B pour le gras.") + '</span><button type="button" class="primary" data-act="save"' + (saving ? " disabled" : "") + ">" + (saving ? "Enregistrement…" : "Enregistrer") + '</button><button type="button" data-act="cancel"' + (saving ? " disabled" : "") + ">Annuler</button>";
  }
}
bar.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act; msg = "";
  if (act === "edit") { editing = true; render(); }
  else if (act === "cancel") { data = JSON.parse(DATA_SRC); editing = false; render(); }
  else if (act === "restore") { try { data = JSON.parse(sessionStorage.getItem("trip-draft")); sessionStorage.removeItem("trip-draft"); } catch(err){} editing = true; render(); }
  else if (act === "drop") { try { sessionStorage.removeItem("trip-draft"); } catch(err){} renderBar(); }
  else if (act === "save") { save(false); }
  else if (act === "export") { exportFile(); }
});

function exportFile(){
  var html = buildDoc();
  if (art && art.local) {
    try {
      var url = URL.createObjectURL(new Blob([html], { type:"text/html" }));
      var lnk = document.createElement("a"); lnk.href = url; lnk.download = exportName();
      document.body.appendChild(lnk); lnk.click(); lnk.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      msg = "Fichier exporté dans vos téléchargements.";
    } catch (err) { msg = "L’export a échoué."; }
    renderBar(); return;
  }
  if (!dlApi) return;
  dlApi.save({ filename:exportName(), data:new Blob([html]) }).then(function(r){
    msg = r && r.status === "saved" ? "Fichier exporté." : ""; renderBar();
  }, function(err){
    var c = err && err.code;
    if (c === "declined") msg = "";
    else if (c === "rate_limited") msg = "Un export est déjà en cours. Réessayez dans un instant.";
    else if (c === "too_large") msg = "La page est trop lourde pour être exportée ici.";
    else if (c === "rejected_extension" || c === "extension_not_enabled") { msg = "L’export en HTML n’est pas disponible ici."; dlApi = null; }
    else { msg = "L’export n’est pas disponible dans cette vue."; dlApi = null; }
    renderBar();
  });
}

function save(retried){
  collect();
  saving = true; renderBar();
  try { sessionStorage.removeItem("trip-draft"); } catch(e){}
  if (art.local) {
    var js = JSON.stringify(data);
    try { localStorage.setItem("trip-local-data", JSON.stringify({ base:BASE_HASH, data:js })); msg = "Enregistré dans ce navigateur. Cliquez sur Exporter pour en faire un fichier."; }
    catch (err) { msg = "Impossible d’enregistrer dans ce navigateur. Utilisez Exporter pour garder vos modifications."; }
    DATA_SRC = js; editing = false; saving = false; render();
    return;
  }
  art.publish(buildDoc()).then(function(){
    msg = "Enregistré. La page se recharge…"; saving = false; renderBar();
  }, function(err){
    saving = false;
    var code = err && err.code;
    if (code === "conflict") {
      try { sessionStorage.setItem("trip-draft", JSON.stringify(data)); } catch(e){}
      msg = "La page a été modifiée ailleurs entre-temps et se recharge. Vos modifications sont gardées pour être restaurées.";
    } else if (["not_writer","not_granted","consent_required","not_declared","capability_disabled","capability_removed"].indexOf(code) >= 0) {
      readOnly = true; editing = false; data = JSON.parse(DATA_SRC);
      msg = "Cette page est en lecture seule pour vous."; render(); return;
    } else if (code === "rate_limited") {
      msg = "Trop d’enregistrements rapprochés. Attendez un instant puis réessayez.";
    } else if (code === "too_large") {
      msg = "La page est devenue trop lourde pour être enregistrée.";
    } else if (!retried && (code === "upstream_error" || !code)) {
      setTimeout(function(){ save(true); }, 800 + Math.random() * 1200); return;
    } else {
      msg = "L’enregistrement a échoué. Vos modifications sont toujours là ; réessayez.";
    }
    renderBar();
  });
}

/* theme toggle: auto (system) -> jour -> nuit */
var THEMES = ["auto", "light", "dark"];
var THEME_UI = {
  auto:{ t:"Auto", i:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2"/><path class="half" d="M8 2.8a5.2 5.2 0 0 1 0 10.4z"/></svg>' },
  light:{ t:"Jour", i:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>' },
  dark:{ t:"Nuit", i:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 10.2A5.6 5.6 0 0 1 5.8 3a5.6 5.6 0 1 0 7.2 7.2z"/></svg>' }
};
var theme = "auto";
try { var t1 = localStorage.getItem("trip-theme"); if (THEMES.indexOf(t1) >= 0) theme = t1; } catch(e){}
var tbtn = document.createElement("button");
tbtn.type = "button"; tbtn.className = "themebtn";
function applyTheme(){
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  tbtn.innerHTML = THEME_UI[theme].i + "<span>" + THEME_UI[theme].t + "</span>";
  tbtn.title = "Thème : " + THEME_UI[theme].t.toLowerCase() + " (cliquer pour changer)";
  tbtn.setAttribute("aria-label", "Thème : " + THEME_UI[theme].t + ". Changer de thème");
}
tbtn.addEventListener("click", function(){
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("trip-theme", theme); } catch(e){}
  applyTheme();
});
applyTheme();
document.body.appendChild(tbtn);

render();
if (location.hash) { var t0 = document.getElementById(location.hash.slice(1)); if (t0) setTimeout(function(){ t0.scrollIntoView(); }, 50); }

if (window.claude && window.claude.use) {
  window.claude.use("artifact").then(function(a){
    if (!a) return;
    art = a;
    return window.claude.use("user").then(function(u){
      if (!u || !u.can) return null;
      return u.can("files.write");
    }).then(function(ok){ if (ok === false) readOnly = true; }, function(){});
  }).then(function(){ renderBar(); }, function(){});
  window.claude.use("downloads").then(function(x){ dlApi = x || null; renderBar(); }, function(){});
} else {
  art = { local:true };
  try {
    var saved = JSON.parse(localStorage.getItem("trip-local-data") || "null");
    if (saved && saved.base === BASE_HASH && saved.data) { data = JSON.parse(saved.data); DATA_SRC = saved.data; render(); msg = "Vos modifications enregistrées dans ce navigateur ont été rechargées."; }
  } catch (err) {}
  renderBar();
}
})();
</script>
